<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House List – CrisTatePro</title>
    <link rel="icon" href="/IMAGES/lightlogo.png" type="image/png">
    <link rel="stylesheet" href="/CSS/houselist.css" />

    <script src="/JS/api.js" defer></script>
    <script type="module" src="/js/houseData.js" defer></script>

    <script type="module" src="/JS/searchFilter.js" defer></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body onload="updateGreeting()">
    <header class="header">
      <div class="container">
        <h1 class="logo">CrisTatePro</h1>
        <div class="user-info">
          <img
            src="/IMAGES/logo.png"
            alt="Profile"
            class="avatar"
            id="profile-avatar"
          />
          <span id="greeting">Hello, User 😊</span>
        </nav>
        <div class="header-icons">
          <i id="search-toggle" class="fas fa-search" title="Toggle Search"></i>
          <i id="filter-toggle" class="fas fa-filter" title="Toggle Filters"></i>
        </div>
          <div class="mobile-menu-icon" id="mobile-menu-icon">
            <span class="material-icons" id="menu-icon">menu</span>
          </div>
        </div>
        <nav>
          <ul class="nav-list">
            <li><a href="landing.html">Home</a></li>
            <li><a href="favouritehouse.html">Favourites</a></li>
            <li>
              <a
                href="#"
                onclick="checkLoginAndRedirect(event, '/HTML/Features/inbox.html')"
                >Chats</a
              >
            </li>
            <li><a href="aboutus.html">About Us</a></li>
            <li>
              <a
                href="/HTML/Authentication/profile.html"
                class="login-btn"
                id="profile-btn"
                >Profile</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section id="house-list">
      <h2>All Properties</h2>

       <!-- Loading Spinner -->
  <div id="loading-spinner" class="loading-spinner" style="display: flext;">
    <div class="spinner"></div>
    <p>Loading houses...</p>
  </div>
      <div id="search-container" class="input-container" style="display: none">
        <div class="input-container">
          <span class="icon">🔍</span>
          <input type="text" id="search" placeholder="Search houses..." />
          <button class="clear-button" id="clear-search">&times;</button>
        </div>
      </div>

      <div id="filter-section" class="filter" style="display: none">
        <!-- County Field with Prefix Icon and Clear Button -->
        <div class="input-container">
          <span class="icon">📍</span>
          <input type="text" id="county" placeholder="Search counties..." />
          <button class="clear-button" id="clear-county">&times;</button>
        </div>
        <!-- Property Type Dropdown -->
        <label for="property-type">Property Type:</label>
        <select id="property-type">
          <option value="">All Types</option>
          <option value="Apartment">Apartments</option>
          <option value="House">Houses</option>
          <option value="Villa">Villas</option>
          <option value="Condo">Condos</option>
          <option value="Bungalow">Bungalows</option>
          <option value="Townhouse">Townhouses</option>
          <option value="Loft">Lofts</option>
        </select>
        <!-- Min and Max Price Fields -->
        <div class="input-container">
          <span class="icon">💰</span>
          <input type="number" id="min-price" placeholder="Min Price" />
          <button class="clear-button" id="clear-min-price">&times;</button>
        </div>
        <div class="input-container">
          <span class="icon">💰</span>
          <input type="number" id="max-price" placeholder="Max Price" />
          <button class="clear-button" id="clear-max-price">&times;</button>
        </div>
        <!-- Bedrooms and Bathrooms Dropdown -->
        <label for="bedrooms">Bedrooms:</label>
        <select id="bedrooms">
          <option value="">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4+</option>
        </select>
        <label for="bathrooms">Bathrooms:</label>
        <select id="bathrooms">
          <option value="">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4+</option>
        </select>
        <!-- Amenities Field with Clear Button -->
        <div class="input-container">
          <span class="icon">🏠</span>
          <input type="text" id="amenities" placeholder="Search amenities..." />
          <button class="clear-button" id="clear-amenities">&times;</button>
        </div>
        <!-- Remove All Filters Button -->
        <button id="remove-all-filters">Remove All Filters</button>
      </div>
      <div id="property-list"></div>
    </section>

    <footer>
      <p>&copy; 2024 CrisTatePro | Powered by CrisTatePro Ltd Company</p>
    </footer>
  </body>
</html>
