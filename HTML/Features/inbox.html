<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat UI - CrisTatePro</title>
    <link rel="icon" href="/IMAGES/lightlogo.png" type="image/png" />
    <link rel="stylesheet" href="/CSS/inbox.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button id="go-back-btn" class="go-back-btn" onclick="goBack()">
          Back
        </button>
        <!-- Back Button -->
      </div>
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search participants..."
        />
        <!-- Search clear button -->
        <button
          id="clearSearch"
          class="clear-search-button"
          style="display: none"
          onclick="clearSearchInput()"
        >
          <i class="fa fa-times-circle"></i>
        </button>
      </div>
      <div id="contacts"></div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none">
      <div class="chat-header">
        <img src="/IMAGES/darklogo.png" alt="Participant Avatar" />
        Chat with <span id="chatWith"></span>
        <button class="toggle-dark-mode" onclick="toggleDarkMode()">
          <!-- <span id="mode-icon">🌙</span> -->
        </button>
        <button class="exit-chat-btn" onclick="exitChat()">Close Chat</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input
          type="text"
          id="messageInput"
          placeholder="Type a message"
          name="message"
        />
        <button id="sendButton">
          <i class="fas fa-paper-plane" id="sendIcon" aria-hidden="true"></i>
          <i
            class="fas fa-spinner fa-spin"
            id="sendingIcon"
            style="display: none"
          ></i>
        </button>
      </div>
    </div>

    <div class="placeholder" id="placeholder" style="display: flex">
      <img src="/IMAGES/lightlogo.png" alt="No Chats" />
      <h3>Select a chat to start messaging!</h3>
      <p>Click on a contact to begin a conversation.</p>
    </div>

    <div id="alert-message" class="alert-message" style="display: none"></div>

    <script type="module" src="/JS/messageModel.js"></script>
    <script src="/JS/api.js"></script>
    <script type="module" src="/JS/chat.js"></script>
  </body>
</html>
